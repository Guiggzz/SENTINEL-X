<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SENTINEL-X — Connexion</title>
  <link rel="stylesheet" href="/static/login.css?v=1" />
</head>
<body>
  <form class="card" id="login-form" autocomplete="on">
    <h1>SENTINEL-X</h1>
    <p class="sub">Accès opérateur — atelier cybersécurité</p>
    <div class="hairline"></div>
    <div class="err" id="err"></div>
    <label for="username">Identifiant</label>
    <input id="username" name="username" required autocomplete="username" />
    <label for="password">Mot de passe</label>
    <input id="password" name="password" type="password" required autocomplete="current-password" />
    <button type="submit">Se connecter</button>
  </form>
  <script src="/static/login.js?v=1"></script>
</body>
</html>

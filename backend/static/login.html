<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SENTINEL-X — Connexion</title>
  <style>
    :root { --ink:#1a1a1a; --paper:#f4f1ea; --hair:#c9c2b4; --accent:#2c4a3e; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--paper); color: var(--ink);
      font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    }
    .card {
      width: min(380px, 92vw); padding: 2rem 1.75rem;
      border: 1px solid var(--hair); background: #faf8f3;
    }
    h1 { font-size: 1.15rem; font-weight: 600; margin: 0 0 .25rem; letter-spacing: .04em; }
    p.sub { margin: 0 0 1.5rem; color: #555; font-size: .85rem; }
    label { display: block; font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; margin-bottom: .35rem; }
    input {
      width: 100%; padding: .65rem .7rem; margin-bottom: 1rem;
      border: 1px solid var(--hair); background: #fff; color: var(--ink);
      font: inherit;
    }
    button {
      width: 100%; padding: .7rem; border: 1px solid var(--accent);
      background: var(--accent); color: #f4f1ea; font: inherit; cursor: pointer;
      letter-spacing: .06em; text-transform: uppercase; font-size: .8rem;
    }
    button:hover { filter: brightness(1.08); }
    .err { color: #8b1e1e; font-size: .85rem; min-height: 1.2em; margin-bottom: .75rem; }
    .hairline { height: 1px; background: var(--hair); margin: 0 0 1.25rem; }
  </style>
</head>
<body>
  <form class="card" id="login-form" autocomplete="on">
    <h1>SENTINEL-X</h1>
    <p class="sub">Accès opérateur — atelier cybersécurité</p>
    <div class="hairline"></div>
    <div class="err" id="err"></div>
    <label for="username">Identifiant</label>
    <input id="username" name="username" required autocomplete="username" />
    <label for="password">Mot de passe</label>
    <input id="password" name="password" type="password" required autocomplete="current-password" />
    <button type="submit">Se connecter</button>
  </form>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('err');
      err.textContent = '';
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      try {
        const r = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ username, password }),
        });
        if (!r.ok) {
          const j = await r.json().catch(() => ({}));
          err.textContent = j.detail || 'Échec de connexion';
          return;
        }
        location.href = '/';
      } catch (ex) {
        err.textContent = 'Erreur réseau';
      }
    });
  </script>
</body>
</html>

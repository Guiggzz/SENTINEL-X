# SENTINEL-X — stack durcie (TLS, non-root, limits, réseaux)
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  sentinel-front:
  sentinel-back:
    internal: true

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    container_name: sentinel-mosquitto
    restart: unless-stopped
    ports:
      - "8883:8883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/config/acl:/mosquitto/config/acl:ro
      - ./mosquitto/config/passwd:/mosquitto/config/passwd:ro
      - ./certs/ca.crt:/mosquitto/certs/ca.crt:ro
      - ./certs/server.crt:/mosquitto/certs/server.crt:ro
      - ./certs/server.key:/mosquitto/certs/server.key:ro
      - mosquitto-data:/mosquitto/data
    # Entrypoint eclipse-mosquitto fait chown puis bascule en uid 1883 :
    # on retire toutes les capabilities sauf celles strictement nécessaires
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 100
    logging: *default-logging
    networks: [sentinel-front, sentinel-back]
    healthcheck:
      test: ["CMD-SHELL", "pidof mosquitto || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  db:
    image: postgres:16-alpine
    container_name: sentinel-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - sentinel-pgdata:/var/lib/postgresql/data
    # pas de port hôte
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Postgres a besoin d'écrire hors volume data — pas de read_only ;
    # capabilities réduites au minimum requis par l'entrypoint officiel (chown + bascule uid postgres)
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    shm_size: 128m
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
    logging: *default-logging
    networks: [sentinel-back]

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: sentinel-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      MQTT_HOST: sentinel-mosquitto
      MQTT_PORT: "8883"
      MQTT_TLS: "true"
      MQTT_CA_FILE: /certs/ca.crt
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      API_TOKEN: ${API_TOKEN}
      OPERATOR_USER: ${OPERATOR_USER:-operateur}
      OPERATOR_PASSWORD_HASH: ${OPERATOR_PASSWORD_HASH}
      SESSION_SECRET: ${SESSION_SECRET}
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro
    # Galerie visages : disque de l'hôte (vision/data/gallery), lue par sentinel-vision.
    # L'API authentifie /api/v1/faces et proxifie vers VISION_BASE_URL. Pas de volume ici.
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
    logging: *default-logging
    networks: [sentinel-front, sentinel-back]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  ml:
    build:
      context: ../ml
      dockerfile: Dockerfile
    container_name: sentinel-ml
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MQTT_HOST: sentinel-mosquitto
      MQTT_PORT: "8883"
      MQTT_USERNAME: ${MQTT_USERNAME_ML:-sentinel-ml}
      MQTT_PASSWORD: ${MQTT_PASSWORD_ML}
      MQTT_TLS: "true"
      MQTT_CA_FILE: /certs/ca.crt
      MQTT_TELEMETRY_TOPIC: ${MQTT_TELEMETRY_TOPIC:-sentinel/+/telemetry}
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      ML_MODEL_DIR: /app/models
      ML_ACTUATOR_DEVICE: ${ML_ACTUATOR_DEVICE:-sentinel-node-01}
      ML_TRAIN_DEVICE: ${ML_TRAIN_DEVICE:-sentinel-node-01}
      ML_GAS_BUZZER_MS: ${ML_GAS_BUZZER_MS:-0}
      ML_REARM_S: ${ML_REARM_S:-60}
      API_TOKEN: ${API_TOKEN}
      API_BASE_URL: ${API_BASE_URL:-http://api:3000}
    volumes:
      - ../ml/models:/app/models
      - ../ml/evaluation.md:/app/evaluation.md
      - ../ml/training_exclusions.json:/app/training_exclusions.json:ro
      - ./certs/ca.crt:/certs/ca.crt:ro
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started
      api:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 200
    logging: *default-logging
    # Réseau interne uniquement (DB + broker + API) : ni joignable depuis le proxy, ni sortie Internet
    networks: [sentinel-back]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('sentinel-mosquitto', 8883), 3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  proxy:
    image: caddy:2.8-alpine
    container_name: sentinel-proxy
    restart: unless-stopped
    # Seul 443 est publié ici ; la redirection :80 -> https est ajoutée par
    # docker-compose.override.yml (créé par harden-root.sh après arrêt d'Apache)
    ports:
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs/server.crt:/certs/server.crt:ro
      - ./certs/server.key:/certs/server.key:ro
      - caddy-data:/data
      - caddy-config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - api
    read_only: true
    tmpfs:
      - /tmp
      - /data/caddy/locks
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.50
    # Caddy (Go) tourne déjà vers ~100 threads : à 100 le wget du healthcheck ne pouvait plus forker
    pids_limit: 200
    logging: *default-logging
    networks: [sentinel-front]
    healthcheck:
      # chaîne complète : TLS Caddy -> API -> DB
      test: ["CMD-SHELL", "wget -q -O /dev/null --no-check-certificate https://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mosquitto-data:
  sentinel-pgdata:
  caddy-data:
  caddy-config:
